name: Build AABrowser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build workflow
        uses: actions/checkout@v4

      - name: Checkout original AABrowser
        uses: actions/checkout@v4
        with:
          repository: kododake/AABrowser
          path: source
          fetch-depth: 1

      - name: Apply in-motion configuration
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()

          # Keep the original Android Auto integration intact, but use the
          # requested productivity app category.
          s = s.replace('android:appCategory="game"', 'android:appCategory="productivity"')

          # Parked apps must not advertise distractionOptimized. Android Auto
          # then applies its own parked-app blocking when the vehicle moves.
          import re
          s = re.sub(r'\n\s*<meta-data\s+android:name="distractionOptimized"\s+android:value="true"\s*/>', '', s)

          manifest.write_text(s)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: source
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AABrowser-in-motion-debug
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
